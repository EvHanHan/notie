[package]
name = "notie-transcriber"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Metal can fail to initialize on otherwise supported Macs (for example, when
# macOS cannot create a command queue). transcribe-cpp 0.1.3 then attempts to
# allocate through the failed backend and crashes instead of falling back.
transcribe-cpp = { version = "0.1.3", default-features = false }
